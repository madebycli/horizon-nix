name: Update upstream release

on:
  workflow_dispatch:
  schedule:
    # 04:07 in Berlin during daylight-saving time, 03:07 in winter.
    - cron: "7 2 * * *"

permissions:
  contents: write

concurrency:
  group: horizon-upstream-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Resolve, verify and pin the newest releases
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/update_test.py
          python3 scripts/update.py
          unexpected="$(git diff --name-only | grep -Ev '^releases\.json$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected files changed:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          if git diff --quiet -- releases.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --check
            git --no-pager diff -- releases.json
          fi

      - name: Validate the updated pins
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update.py --verify
          nix flake check --no-write-lock-file --print-build-logs
          nix build .#horizon-launcher .#horizon-server .#horizon-server-nightly --no-write-lock-file --print-build-logs
          ./result-1/bin/horizon-server --version

      - name: Publish validated pins
        if: steps.update.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "main advanced during validation; leaving publication to the next run" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- releases.json
          git commit -m "chore(update): pin newest Horizon releases"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
